# Incremental product-owned server blocks only.
# Never copy this file over the shared platform Nginx configuration.
server {
    listen 80;
    listen [::]:80;
    server_name maas.lifeyoume.icu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name maas.lifeyoume.icu;

    ssl_certificate /etc/nginx/certs/maas.lifeyoume.icu.pem;
    ssl_certificate_key /etc/nginx/certs/maas.lifeyoume.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /_lifeyoume_admin_check {
        internal;
        proxy_pass http://127.0.0.1:8802/api/v1/admin/access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location ~ ^/(health/live|health/ready)$ {
        proxy_pass http://127.0.0.1:43280;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:43280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-LifeYouMe-Admin-User "";
        proxy_read_timeout 130s;
        client_max_body_size 20m;
    }

    location /api/admin/ {
        auth_request /_lifeyoume_admin_check;
        auth_request_set $lifeyoume_admin_user $upstream_http_x_lifeyoume_admin_user;
        error_page 401 =302 https://lifeyoume.icu/admin/;
        proxy_pass http://127.0.0.1:43280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-LifeYouMe-Admin-User $lifeyoume_admin_user;
        proxy_read_timeout 35s;
        client_max_body_size 128k;
    }

    location / {
        auth_request /_lifeyoume_admin_check;
        auth_request_set $lifeyoume_admin_user $upstream_http_x_lifeyoume_admin_user;
        error_page 401 =302 https://lifeyoume.icu/admin/;
        proxy_pass http://127.0.0.1:43280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-LifeYouMe-Admin-User $lifeyoume_admin_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 130s;
        client_max_body_size 20m;
    }
}
