location = /_lifeyoume_access_check {
    internal;
    proxy_pass http://127.0.0.1:8802/api/v1/access/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-LifeYouMe-Product-ID $lifeyoume_product_id;
}

location = /video/ {
    set $lifeyoume_product_id frame60;
    auth_request /_lifeyoume_access_check;
    auth_request_set $lifeyoume_user_id $upstream_http_x_lifeyoume_user_id;
    error_page 401 =302 https://auth.lifeyoume.icu/login?return_to=https://lifeyoume.icu/video/;
    proxy_pass http://127.0.0.1:4321/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-LifeYouMe-User-ID $lifeyoume_user_id;
    proxy_read_timeout 120s;
    client_max_body_size 256k;
}

location /video/ {
    proxy_pass http://127.0.0.1:4321/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    client_max_body_size 256k;

    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/video/';
    sub_filter 'src="/' 'src="/video/';
}
