    location = /ai-team {
        return 308 /ai-team/;
    }

    location = /_lifeyoume_ai_team_session_verify {
        internal;
        proxy_pass http://127.0.0.1:8802/api/v1/session/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /ai-team/auth/login {
        proxy_pass http://127.0.0.1:45174/index;
        add_header Cache-Control "no-store" always;
    }

    location = /ai-team/auth/register {
        proxy_pass http://127.0.0.1:45174/index;
        add_header Cache-Control "no-store" always;
    }

    location = /ai-team/auth/callback {
        proxy_pass http://127.0.0.1:45174/index;
        add_header Cache-Control "no-store" always;
    }

    location = /ai-team/auth/session/bootstrap/login {
        proxy_pass http://127.0.0.1:8802/login?return_to=https%3A%2F%2Flifeyoume.icu%2Fai-team%2Fauth%2Fcallback;
        proxy_set_header Host auth.lifeyoume.icu;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location = /ai-team/auth/session/bootstrap/register {
        proxy_pass http://127.0.0.1:8802/register?return_to=https%3A%2F%2Flifeyoume.icu%2Fai-team%2Fauth%2Fcallback;
        proxy_set_header Host auth.lifeyoume.icu;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location = /ai-team/auth/session/submit/login {
        proxy_pass http://127.0.0.1:8802/login;
        proxy_set_header Host auth.lifeyoume.icu;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location = /ai-team/auth/session/submit/register {
        proxy_pass http://127.0.0.1:8802/register;
        proxy_set_header Host auth.lifeyoume.icu;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location = /ai-team/api/auth/sso/exchange {
        auth_request /_lifeyoume_ai_team_session_verify;
        auth_request_set $lifeyoume_user_id $upstream_http_x_lifeyoume_user_id;
        auth_request_set $lifeyoume_user_email $upstream_http_x_lifeyoume_user_email;
        proxy_pass http://127.0.0.1:45174/exchange;
        proxy_set_header X-LifeYouMe-User-ID $lifeyoume_user_id;
        proxy_set_header X-LifeYouMe-User-Email $lifeyoume_user_email;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        add_header Cache-Control "no-store" always;
    }

    location /ai-team/ {
        proxy_pass http://127.0.0.1:45173/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ai-team;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_redirect ~^(/.*)$ /ai-team$1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 64m;
    }
