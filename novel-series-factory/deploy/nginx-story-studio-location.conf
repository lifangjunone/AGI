    location = /story-studio {
        return 301 /story-studio/;
    }

    location /story-studio/ {
        set $lifeyoume_product_id story-studio;
        auth_request /_lifeyoume_access_check;
        auth_request_set $lifeyoume_user_id $upstream_http_x_lifeyoume_user_id;
        error_page 401 =302 https://auth.lifeyoume.icu/login?return_to=https://lifeyoume.icu/story-studio/;
        error_page 403 = /product-disabled;
        proxy_pass http://127.0.0.1:4361;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-LifeYouMe-User-ID $lifeyoume_user_id;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        client_max_body_size 12m;
        add_header Cache-Control "no-store";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }
