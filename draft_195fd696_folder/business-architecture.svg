<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f7f8f5"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191919"/>
      <stop offset="1" stop-color="#3b3b38"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="8" y="8" width="1184" height="704" rx="30" fill="url(#paper)" stroke="#dedfd9"/>
  <text x="600" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#171717">业务架构：一套学习底座，两条价值路径</text>
  <text x="600" y="92" text-anchor="middle" font-size="17" fill="#62625d">不要求员工额外整理，让真实工作持续变成可执行能力</text>

  <circle cx="600" cy="222" r="92" fill="url(#core)" filter="url(#shadow)"/>
  <text x="600" y="210" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">另一个我</text>
  <text x="600" y="242" text-anchor="middle" font-size="17" fill="#f4d8a0">从真实工作学习</text>
  <text x="600" y="268" text-anchor="middle" font-size="15" fill="#d8d8d2">知识 · 判断 · 技能 · 边界</text>

  <polyline points="508,222 418,222 418,278" fill="none" stroke="#2878d0" stroke-width="5"/>
  <polygon points="408,278 428,278 418,296" fill="#2878d0"/>
  <polyline points="692,222 782,222 782,278" fill="none" stroke="#0b9271" stroke-width="5"/>
  <polygon points="772,278 792,278 782,296" fill="#0b9271"/>

  <rect x="72" y="302" width="468" height="284" rx="24" fill="#eef5ff" stroke="#8ab8ea" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="126" cy="356" r="28" fill="#2878d0"/>
  <text x="126" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">1</text>
  <text x="172" y="350" font-size="25" font-weight="700" fill="#17324e">普通员工技能学习</text>
  <text x="172" y="380" font-size="17" fill="#42627e">让数字员工接管已经确定、验证过的任务</text>

  <rect x="104" y="414" width="116" height="58" rx="16" fill="#ffffff" stroke="#b8d2ec"/>
  <text x="162" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4f82">学习动作</text>
  <text x="162" y="461" text-anchor="middle" font-size="14" fill="#587795">流程与工具</text>
  <polyline points="220,443 248,443" fill="none" stroke="#2878d0" stroke-width="3"/>
  <polygon points="248,436 264,443 248,450" fill="#2878d0"/>
  <rect x="264" y="414" width="116" height="58" rx="16" fill="#ffffff" stroke="#b8d2ec"/>
  <text x="322" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4f82">任务验证</text>
  <text x="322" y="461" text-anchor="middle" font-size="14" fill="#587795">稳定可复跑</text>
  <polyline points="380,443 408,443" fill="none" stroke="#2878d0" stroke-width="3"/>
  <polygon points="408,436 424,443 408,450" fill="#2878d0"/>
  <rect x="424" y="414" width="84" height="58" rx="16" fill="#2878d0"/>
  <text x="466" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">替真人</text>
  <text x="466" y="460" text-anchor="middle" font-size="14" fill="#eaf4ff">完成任务</text>

  <text x="104" y="514" font-size="17" font-weight="700" fill="#17324e">高价值场景</text>
  <text x="222" y="514" font-size="17" fill="#334f68">Oncall 初筛 · 客户问答 · 进度跟进 · 固定操作</text>
  <rect x="104" y="536" width="404" height="32" rx="16" fill="#d8eaff"/>
  <text x="306" y="558" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5f9d">目标示例：接管约 40% 可重复工作，最终以试点数据为准</text>

  <rect x="660" y="302" width="468" height="284" rx="24" fill="#edfaf5" stroke="#7cc9b3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="714" cy="356" r="28" fill="#0b9271"/>
  <text x="714" y="365" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">2</text>
  <text x="760" y="350" font-size="25" font-weight="700" fill="#154d3f">专家能力提炼</text>
  <text x="760" y="380" font-size="17" fill="#3b6f61">让专家能力变成 AgentSphere 领域数字员工</text>

  <rect x="692" y="414" width="112" height="58" rx="16" fill="#ffffff" stroke="#a7d8ca"/>
  <text x="748" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="#176b56">学习判断</text>
  <text x="748" y="461" text-anchor="middle" font-size="14" fill="#538274">经验与边界</text>
  <polyline points="804,443 830,443" fill="none" stroke="#0b9271" stroke-width="3"/>
  <polygon points="830,436 846,443 830,450" fill="#0b9271"/>
  <rect x="846" y="414" width="112" height="58" rx="16" fill="#ffffff" stroke="#a7d8ca"/>
  <text x="902" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="#176b56">每日快照</text>
  <text x="902" y="461" text-anchor="middle" font-size="14" fill="#538274">技能点版本</text>
  <polyline points="958,443 984,443" fill="none" stroke="#0b9271" stroke-width="3"/>
  <polygon points="984,436 1000,443 984,450" fill="#0b9271"/>
  <rect x="1000" y="414" width="96" height="58" rx="16" fill="#0b9271"/>
  <text x="1048" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">AgentSphere</text>
  <text x="1048" y="460" text-anchor="middle" font-size="14" fill="#e6fff8">专家员工</text>

  <text x="692" y="514" font-size="17" font-weight="700" fill="#154d3f">组织结果</text>
  <text x="794" y="514" font-size="17" fill="#35695b">专家能力可复制、可更新、可调度、可审计</text>
  <rect x="692" y="536" width="404" height="32" rx="16" fill="#d5f1e8"/>
  <text x="894" y="558" text-anchor="middle" font-size="15" font-weight="700" fill="#176b56">形成该领域持续成长的数字员工专家</text>

  <rect x="126" y="628" width="948" height="54" rx="18" fill="#fff2d8" stroke="#e6bd69"/>
  <text x="600" y="650" text-anchor="middle" font-size="16" font-weight="700" fill="#65430f">共同底线：明确授权范围 · 能力有证据 · 任务先验证 · 高风险人工确认 · 全程可追溯</text>
  <text x="600" y="673" text-anchor="middle" font-size="14" fill="#805d25">“看过资料”不等于“能接任务”，只有验证过的技能才进入执行</text>
</svg>
