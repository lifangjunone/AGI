<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <rect width="1080" height="1440" fill="#FCFCF8"/>
  <rect x="48" y="48" width="984" height="1344" rx="46" fill="#FFF4EA"/>
  <rect x="78" y="82" width="924" height="1276" rx="34" fill="#FFFFFF"/>
  <rect x="90" y="112" width="520" height="58" rx="29" fill="#DB6B2D"/>
  <text x="350" y="151" text-anchor="middle" class="eyebrow">几十张截图怎么交</text>
  <text x="90" y="330" class="title">截图越多</text>
  <text x="90" y="450" class="title">越要先编号和排序</text>
  <rect x="90" y="548" width="900" height="10" rx="5" fill="#DB6B2D"/>
  <text x="90" y="666" class="label">你最终会得到</text>

    <g transform="translate(90 790)">
      <circle cx="30" cy="30" r="30" fill="#DB6B2D"/>
      <text x="30" y="43" text-anchor="middle" class="index">1</text>
      <text x="88" y="44" class="point">按时间排列</text>
    </g>
    <g transform="translate(90 902)">
      <circle cx="30" cy="30" r="30" fill="#DB6B2D"/>
      <text x="30" y="43" text-anchor="middle" class="index">2</text>
      <text x="88" y="44" class="point">对应证明内容</text>
    </g>
    <g transform="translate(90 1014)">
      <circle cx="30" cy="30" r="30" fill="#DB6B2D"/>
      <text x="30" y="43" text-anchor="middle" class="index">3</text>
      <text x="88" y="44" class="point">保留原文件</text>
    </g>
  <rect x="90" y="1190" width="900" height="112" rx="24" fill="#FFF4EA"/>
  <text x="540" y="1259" text-anchor="middle" class="footer">不是代投诉，是把材料整理清楚</text>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    .eyebrow { fill: #FFFFFF; font-size: 27px; font-weight: 600; }
    .title { fill: #14231B; font-size: 72px; font-weight: 700; letter-spacing: -2px; }
    .label { fill: #607067; font-size: 32px; font-weight: 600; }
    .index { fill: #FFFFFF; font-size: 30px; font-weight: 700; }
    .point { fill: #14231B; font-size: 47px; font-weight: 650; }
    .footer { fill: #263E31; font-size: 30px; font-weight: 600; }
  </style>
</svg>