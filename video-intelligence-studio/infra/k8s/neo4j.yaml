apiVersion: v1
kind: Secret
metadata:
  name: narrative-lens-neo4j-auth
type: Opaque
stringData:
  NEO4J_AUTH: neo4j/narrative-lens-local
---
apiVersion: v1
kind: Service
metadata:
  name: narrative-lens-neo4j
spec:
  selector:
    app: narrative-lens-neo4j
  ports:
    - name: browser
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: narrative-lens-neo4j
spec:
  serviceName: narrative-lens-neo4j
  replicas: 1
  selector:
    matchLabels:
      app: narrative-lens-neo4j
  template:
    metadata:
      labels:
        app: narrative-lens-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26-community
          ports:
            - name: browser
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          envFrom:
            - secretRef:
                name: narrative-lens-neo4j-auth
          env:
            - name: NEO4J_server_memory_heap_initial__size
              value: 512m
            - name: NEO4J_server_memory_heap_max__size
              value: 1G
            - name: NEO4J_server_memory_pagecache_size
              value: 512m
          readinessProbe:
            httpGet:
              path: /
              port: browser
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
