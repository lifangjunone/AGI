[package]
name = "english-foundation"
version = "0.1.0"
description = "A local-first English foundation learning desktop app"
authors = ["LifeYouMe"]
edition = "2021"

[lib]
name = "english_foundation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
