<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分身工作室</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(720px, calc(100vw - 40px));
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 24px;
      padding: 32px;
      background: #121a2b;
    }
    code {
      color: #8bd0ff;
    }
    p {
      color: #cbd5e1;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>分身工作室已迁移为 Next.js 应用</h1>
    <p>请在当前目录运行：</p>
    <p><code>npm install</code></p>
    <p><code>npm run dev</code></p>
    <p>然后访问 <code>http://localhost:3000</code>。原始静态图册已备份到 <code>legacy/blueprint-static.html</code>，Next 应用中的图册页面是 <code>/blueprint</code>。</p>
  </main>
</body>
</html>
