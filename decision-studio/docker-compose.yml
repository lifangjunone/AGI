services:
  decision-studio:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8810}:8810"
    environment:
      CLM_BASE_URL: ${CLM_BASE_URL:-http://host.docker.internal:8700}
      CLM_API_KEY: ${CLM_API_KEY:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8810}
      RATE_LIMIT: ${RATE_LIMIT:-60/minute}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-120}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1000000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
