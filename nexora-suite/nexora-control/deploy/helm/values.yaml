replicaCount: 2
image: { repository: nexora/nexora-control, tag: "1.0.0", pullPolicy: IfNotPresent }
webImage: { repository: nexora/nexora-control-web, tag: "1.0.0", pullPolicy: IfNotPresent }
service: { apiPort: 8080, webPort: 3002 }
ingress:
  enabled: true
  className: nginx
  host: control.nexora.local
  tls: { enabled: false, secretName: nexora-control-tls }
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 1Gi }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }
config:
  coreURL: http://nexora-core-api:8080
  secretName: nexora-platform-secrets
  databaseURLKey: control-database-url
