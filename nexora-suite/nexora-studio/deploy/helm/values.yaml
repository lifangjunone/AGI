replicaCount: 2
image: { repository: nexora/nexora-studio, tag: "1.0.0", pullPolicy: IfNotPresent }
webImage: { repository: nexora/nexora-studio-web, tag: "1.0.0", pullPolicy: IfNotPresent }
service: { apiPort: 8080, webPort: 3001 }
ingress:
  enabled: true
  className: nginx
  host: studio.nexora.local
  tls: { enabled: false, secretName: nexora-studio-tls }
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 1Gi }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }
config:
  coreURL: http://nexora-core-api:8080
  # Leave empty for the Core + Studio edition.
  controlURL: ""
  secretName: nexora-platform-secrets
  databaseURLKey: studio-database-url
