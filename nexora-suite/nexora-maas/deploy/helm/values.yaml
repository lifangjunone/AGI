replicaCount: 2
image: { repository: nexora/nexora-maas, tag: "1.0.0", pullPolicy: IfNotPresent }
webImage: { repository: nexora/nexora-maas-web, tag: "1.0.0", pullPolicy: IfNotPresent }
service: { apiPort: 8080, webPort: 3003 }
ingress:
  enabled: true
  className: nginx
  host: maas.nexora.local
  tls: { enabled: false, secretName: nexora-maas-tls }
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 1Gi }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }
config:
  coreURL: http://nexora-core-api:8080
  secretName: nexora-platform-secrets
  databaseURLKey: maas-database-url
