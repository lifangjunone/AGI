apiVersion: apps/v1
kind: Deployment
metadata: { name: nexora-maas-api }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: nexora-maas-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: nexora-maas-api } }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: ADDR, value: ":8080" }
            - { name: CORE_URL, value: "{{ .Values.config.coreURL }}" }
            - name: NEXORA_JWT_SECRET
              valueFrom: { secretKeyRef: { name: "{{ .Values.config.secretName }}", key: jwt-secret } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: "{{ .Values.config.secretName }}", key: "{{ .Values.config.databaseURLKey }}" } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: nexora-maas-api }
spec:
  selector: { app.kubernetes.io/name: nexora-maas-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nexora-maas-web }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: nexora-maas-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: nexora-maas-web } }
    spec:
      containers:
        - name: web
          image: "{{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}"
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports: [{ name: http, containerPort: 3003 }]
          env: [{ name: API_PROXY_TARGET, value: "http://nexora-maas-api:8080" }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: nexora-maas-web }
spec:
  selector: { app.kubernetes.io/name: nexora-maas-web }
  ports: [{ name: http, port: 3003, targetPort: http }]
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: nexora-maas-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: nexora-maas-api }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: nexora-maas }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: nexora-maas-web, port: { number: 3003 } } }
{{- end }}
