{{- if .Values.enabled }}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata: { name: "{{ .Values.secrets.name }}" }
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  core-database-url: {{ printf "postgres://nexora:%s@nexora-postgres:5432/nexora_core?sslmode=disable" .Values.secrets.postgresPassword | quote }}
  studio-database-url: {{ printf "postgres://nexora:%s@nexora-postgres:5432/nexora_studio?sslmode=disable" .Values.secrets.postgresPassword | quote }}
  control-database-url: {{ printf "postgres://nexora:%s@nexora-postgres:5432/nexora_control?sslmode=disable" .Values.secrets.postgresPassword | quote }}
  maas-database-url: {{ printf "postgres://nexora:%s@nexora-postgres:5432/nexora_maas?sslmode=disable" .Values.secrets.postgresPassword | quote }}
  minio-access-key: {{ .Values.minio.accessKey | quote }}
  minio-secret-key: {{ .Values.minio.secretKey | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata: { name: nexora-postgres-init }
data:
  00-init.sql: |
    CREATE DATABASE nexora_core;
    CREATE DATABASE nexora_studio;
    CREATE DATABASE nexora_control;
    CREATE DATABASE nexora_maas;
  10-migrate.sql: |
    \connect nexora_core
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE TABLE IF NOT EXISTS tenants (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), name text NOT NULL,
      slug text UNIQUE NOT NULL, created_at timestamptz NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS users (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), tenant_id uuid NOT NULL REFERENCES tenants(id),
      email text NOT NULL, password_hash text NOT NULL, display_name text NOT NULL,
      locale text NOT NULL DEFAULT 'zh-CN', created_at timestamptz NOT NULL DEFAULT now(),
      UNIQUE (tenant_id, email)
    );
    CREATE TABLE IF NOT EXISTS audit_events (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), tenant_id uuid NOT NULL,
      actor_id uuid, action text NOT NULL, resource text NOT NULL,
      metadata jsonb NOT NULL DEFAULT '{}', occurred_at timestamptz NOT NULL DEFAULT now()
    );
    \connect nexora_studio
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE TABLE IF NOT EXISTS agents (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), tenant_id uuid NOT NULL,
      name text NOT NULL, description text NOT NULL DEFAULT '', status text NOT NULL DEFAULT 'draft',
      owner_id uuid NOT NULL, graph jsonb NOT NULL DEFAULT '{"nodes":[],"edges":[]}',
      created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS agent_versions (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), tenant_id uuid NOT NULL,
      agent_id uuid NOT NULL REFERENCES agents(id), version text NOT NULL,
      manifest jsonb NOT NULL, published_at timestamptz NOT NULL DEFAULT now(),
      UNIQUE (agent_id, version)
    );
    \connect nexora_control
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE TABLE IF NOT EXISTS managed_agents (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), tenant_id uuid NOT NULL,
      external_id text, name text NOT NULL, source text NOT NULL,
      version text NOT NULL DEFAULT '', endpoint text NOT NULL DEFAULT '',
      status text NOT NULL DEFAULT 'pending', capabilities jsonb NOT NULL DEFAULT '[]',
      manifest jsonb NOT NULL DEFAULT '{}', owner_id uuid NOT NULL,
      last_heartbeat timestamptz, created_at timestamptz NOT NULL DEFAULT now(),
      updated_at timestamptz NOT NULL DEFAULT now(), UNIQUE (tenant_id, source, external_id)
    );
    CREATE TABLE IF NOT EXISTS policies (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), tenant_id uuid NOT NULL,
      name text NOT NULL, effect text NOT NULL, agent_id uuid,
      environment text NOT NULL DEFAULT '*', allowed_callers jsonb NOT NULL DEFAULT '[]',
      rate_limit_per_minute integer NOT NULL DEFAULT 60,
      enabled boolean NOT NULL DEFAULT true, created_at timestamptz NOT NULL DEFAULT now()
    );
    \connect nexora_maas
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE TABLE IF NOT EXISTS model_providers (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), tenant_id uuid NOT NULL,
      name text NOT NULL, kind text NOT NULL, base_url text NOT NULL,
      encrypted_api_key text NOT NULL DEFAULT '', key_hint text NOT NULL DEFAULT '',
      status text NOT NULL DEFAULT 'active', created_at timestamptz NOT NULL DEFAULT now(),
      updated_at timestamptz NOT NULL DEFAULT now(), UNIQUE (tenant_id, name)
    );
    CREATE TABLE IF NOT EXISTS model_catalog (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), tenant_id uuid NOT NULL,
      provider_id uuid NOT NULL REFERENCES model_providers(id), name text NOT NULL,
      upstream_model text NOT NULL, context_window integer NOT NULL DEFAULT 0,
      input_price_per_mtok numeric(12,6) NOT NULL DEFAULT 0,
      output_price_per_mtok numeric(12,6) NOT NULL DEFAULT 0,
      status text NOT NULL DEFAULT 'active', created_at timestamptz NOT NULL DEFAULT now(),
      updated_at timestamptz NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS model_routes (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), tenant_id uuid NOT NULL,
      name text NOT NULL, alias text NOT NULL, model_id uuid NOT NULL REFERENCES model_catalog(id),
      enabled boolean NOT NULL DEFAULT true, created_at timestamptz NOT NULL DEFAULT now(),
      updated_at timestamptz NOT NULL DEFAULT now(), UNIQUE (tenant_id, alias)
    );
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: nexora-postgres }
spec:
  serviceName: nexora-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: nexora }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: "{{ .Values.secrets.name }}", key: postgres-password } }
            - { name: POSTGRES_DB, value: nexora }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: [sh, -c, "pg_isready -U nexora"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: init
          configMap: { name: nexora-postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: nexora-postgres }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: nexora-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: nexora-redis }
spec:
  serviceName: nexora-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-redis }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args: [redis-server, --appendonly, "yes"]
          ports: [{ name: redis, containerPort: 6379 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { exec: { command: [redis-cli, ping] }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: nexora-redis }
spec:
  selector: { app.kubernetes.io/name: nexora-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: nexora-nats }
spec:
  serviceName: nexora-nats
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-nats }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-nats }
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image | quote }}
          args: [-js, -sd, /data, -m, "8222"]
          ports:
            - { name: client, containerPort: 4222 }
            - { name: monitor, containerPort: 8222 }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { tcpSocket: { port: client }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.nats.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: nexora-nats }
spec:
  selector: { app.kubernetes.io/name: nexora-nats }
  ports:
    - { name: client, port: 4222, targetPort: client }
    - { name: monitor, port: 8222, targetPort: monitor }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: nexora-minio }
spec:
  serviceName: nexora-minio
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-minio }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-minio }
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          args: [server, /data, --console-address, ":9001"]
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: "{{ .Values.secrets.name }}", key: minio-access-key } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: "{{ .Values.secrets.name }}", key: minio-secret-key } }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: api }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.minio.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: nexora-minio }
spec:
  selector: { app.kubernetes.io/name: nexora-minio }
  ports:
    - { name: api, port: 9000, targetPort: api }
    - { name: console, port: 9001, targetPort: console }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nexora-database-migrate
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 12
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-database-migrate }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ .Values.postgres.image | quote }}
          command: [sh, -c]
          args:
            - |
              until pg_isready -h nexora-postgres -U nexora; do sleep 2; done
              PGPASSWORD="$POSTGRES_PASSWORD" psql -v ON_ERROR_STOP=1 \
                -h nexora-postgres -U nexora -d nexora -f /migrations/10-migrate.sql
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: "{{ .Values.secrets.name }}", key: postgres-password } }
          volumeMounts:
            - { name: migrations, mountPath: /migrations }
      volumes:
        - name: migrations
          configMap: { name: nexora-postgres-init }
{{- end }}
