name: nexora-suite

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: nexora
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ../nexora-core/migrations:/migrations/core:ro
      - ../nexora-studio/migrations:/migrations/studio:ro
      - ../nexora-control/migrations:/migrations/control:ro
      - ../nexora-maas/migrations:/migrations/maas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats-data:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexora-development}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  core-api:
    build:
      context: ../nexora-core
      dockerfile: Dockerfile
    environment:
      ADDR: :8080
      NEXORA_JWT_SECRET: ${NEXORA_JWT_SECRET:-nexora-development-secret-change-me}
      NEXORA_ADMIN_PASSWORD: ${NEXORA_ADMIN_PASSWORD:-Nexora123!}
      NEXORA_PRODUCTS: ${NEXORA_PRODUCTS:-studio,control,maas}
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-http://localhost:3001}
      CONTROL_PUBLIC_URL: ${CONTROL_PUBLIC_URL:-http://localhost:3002}
      MAAS_PUBLIC_URL: ${MAAS_PUBLIC_URL:-http://localhost:3003}
      DATABASE_URL: ${CORE_DATABASE_URL:-postgres://nexora:nexora@postgres:5432/nexora_core?sslmode=disable}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  studio-api:
    profiles: ["studio"]
    build:
      context: ../nexora-studio
      dockerfile: Dockerfile
    environment:
      ADDR: :8080
      NEXORA_JWT_SECRET: ${NEXORA_JWT_SECRET:-nexora-development-secret-change-me}
      DATABASE_URL: ${STUDIO_DATABASE_URL:-postgres://nexora:nexora@postgres:5432/nexora_studio?sslmode=disable}
      CORE_URL: http://core-api:8080
      CONTROL_URL: http://control-api:8080
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
    ports: ["8081:8080"]
    depends_on:
      core-api: { condition: service_started }

  control-api:
    profiles: ["control"]
    build:
      context: ../nexora-control
      dockerfile: Dockerfile
    environment:
      ADDR: :8080
      NEXORA_JWT_SECRET: ${NEXORA_JWT_SECRET:-nexora-development-secret-change-me}
      DATABASE_URL: ${CONTROL_DATABASE_URL:-postgres://nexora:nexora@postgres:5432/nexora_control?sslmode=disable}
      CORE_URL: http://core-api:8080
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    ports: ["8082:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  maas-api:
    profiles: ["maas"]
    build:
      context: ../nexora-maas
      dockerfile: Dockerfile
    environment:
      ADDR: :8080
      NEXORA_JWT_SECRET: ${NEXORA_JWT_SECRET:-nexora-development-secret-change-me}
      DATABASE_URL: ${MAAS_DATABASE_URL:-postgres://nexora:nexora@postgres:5432/nexora_maas?sslmode=disable}
      CORE_URL: http://core-api:8080
      NEXORA_DATA_FILE: /data/maas-state.json
    ports: ["8083:8080"]
    volumes: [maas-data:/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  core-web:
    build:
      context: ../nexora-core/web
      args: { NEXT_PUBLIC_CORE_API: "http://localhost:8080/api/v1/auth/login" }
    ports: ["3000:3000"]
    depends_on: [core-api]

  studio-web:
    profiles: ["studio"]
    build:
      context: ../nexora-studio/web
      args: { NEXT_PUBLIC_STUDIO_API: "http://localhost:8081" }
    ports: ["3001:3001"]
    depends_on: [studio-api]

  control-web:
    profiles: ["control"]
    build:
      context: ../nexora-control/web
      args: { NEXT_PUBLIC_CONTROL_API: "http://localhost:8082" }
    ports: ["3002:3002"]
    depends_on: [control-api]

  maas-web:
    profiles: ["maas"]
    build:
      context: ../nexora-maas/web
      args: { NEXT_PUBLIC_MAAS_API: "http://localhost:8083" }
    environment:
      API_PROXY_TARGET: http://maas-api:8080
    ports: ["3003:3003"]
    depends_on: [maas-api]

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  maas-data:
