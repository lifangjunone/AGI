apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-core-api
  labels: { app.kubernetes.io/name: nexora-core-api }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-core-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-core-api }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: ADDR, value: ":8080" }
            - { name: NEXORA_PRODUCTS, value: "{{ .Values.config.products }}" }
            - { name: STUDIO_PUBLIC_URL, value: "{{ .Values.config.studioPublicURL }}" }
            - { name: CONTROL_PUBLIC_URL, value: "{{ .Values.config.controlPublicURL }}" }
            - { name: MAAS_PUBLIC_URL, value: "{{ .Values.config.maasPublicURL }}" }
            - name: NEXORA_JWT_SECRET
              valueFrom: { secretKeyRef: { name: "{{ .Values.config.secretName }}", key: "{{ .Values.config.jwtSecretKey }}" } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: "{{ .Values.config.secretName }}", key: "{{ .Values.config.databaseURLKey }}" } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{ toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: nexora-core-api }
spec:
  selector: { app.kubernetes.io/name: nexora-core-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-core-web
  labels: { app.kubernetes.io/name: nexora-core-web }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-core-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-core-web }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: "{{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}"
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: {{ toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: nexora-core-web }
spec:
  selector: { app.kubernetes.io/name: nexora-core-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora-core
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: nexora-core-api, port: { number: 8080 } } }
          - path: /.well-known
            pathType: Prefix
            backend: { service: { name: nexora-core-api, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: nexora-core-web, port: { number: 3000 } } }
{{- end }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: nexora-core-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: nexora-core-api }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
