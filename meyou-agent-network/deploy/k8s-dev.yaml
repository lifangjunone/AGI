apiVersion: v1
kind: Namespace
metadata:
  name: meyou-dev
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: meyou-dev
spec:
  selector:
    app.kubernetes.io/name: meyou-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: meyou-dev
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meyou-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meyou-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: 10.37.221.24
      containers:
        - name: postgres
          image: docker.m.daocloud.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: meyou
            - name: POSTGRES_DB
              value: meyou
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meyou-datastores
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "meyou", "-d", "meyou"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "meyou", "-d", "meyou"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: /data00/meyou-dev/postgres
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: meyou-dev
spec:
  selector:
    app.kubernetes.io/name: meyou-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: meyou-dev
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meyou-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meyou-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: 10.37.221.24
      containers:
        - name: redis
          image: docker.m.daocloud.io/library/redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meyou-datastores
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /data00/meyou-dev/redis
            type: Directory
