<text x="460" y="553" font-size="18">计划 → SubAgent／Skill</text>
<text x="460" y="588" font-size="18">执行观察 → 验收合并 → 终止</text>
<text x="460" y="623" font-size="16">本轮仅澄清；未验证自动协同</text>
<rect x="800" y="470" width="280" height="170" rx="20" fill="#fff2db" stroke="#a66d20" stroke-dasharray="9 7"/>
