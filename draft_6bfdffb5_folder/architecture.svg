<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880">
<rect width="1440" height="880" fill="#faf7f0"/>
<g font-family="Noto Sans SC, sans-serif" fill="#242424">
