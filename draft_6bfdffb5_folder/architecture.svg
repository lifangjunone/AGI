<rect x="1120" y="470" width="260" height="170" rx="20" fill="#fff2db" stroke="#a66d20" stroke-dasharray="9 7"/>
<text x="1150" y="514" font-size="23" font-weight="bold">输出与运营</text>
<text x="1150" y="553" font-size="18">输出安全、人工兜底</text>
<text x="1150" y="588" font-size="18">统一门户、Trace、灰度</text>
<text x="1150" y="623" font-size="16">需验证与 AS 的治理差异</text>
<rect x="60" y="725" width="1320" height="100" rx="20" fill="#eeebe4"/>
<text x="90" y="766" font-size="22" font-weight="bold">跨链路不变量</text>
<text x="90" y="804" font-size="19">可信身份与知识 ACL　／　会话与长期记忆隔离　／　资产版本映射　／　审计与可回滚路由</text>
