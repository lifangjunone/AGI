<text x="1300" y="254" text-anchor="middle" font-size="16" fill="#ffffff">回复用户</text>
<path d="M505 295V390H220V470M505 390H680V470M990 295V470M1300 295V470" stroke="#a66d20" stroke-width="3" stroke-dasharray="9 7" fill="none"/>
<rect x="60" y="470" width="330" height="170" rx="20" fill="#fff2db" stroke="#a66d20" stroke-dasharray="9 7"/>
<text x="90" y="514" font-size="23" font-weight="bold">输入与知识快路径</text>
<text x="90" y="553" font-size="18">输入安全 → 术语与改写</text>
<text x="90" y="588" font-size="18">FAQ 命中 → 直接答复</text>
<text x="90" y="623" font-size="16">需验证顺序、阈值和知识权限</text>
<rect x="430" y="470" width="330" height="170" rx="20" fill="#fff2db" stroke="#a66d20" stroke-dasharray="9 7"/>
