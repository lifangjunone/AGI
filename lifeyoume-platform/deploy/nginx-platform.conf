map $host $platform_upstream {
    hostnames;
    ops.lifeyoume.icu 127.0.0.1:8801;
    auth.lifeyoume.icu 127.0.0.1:8802;
    billing.lifeyoume.icu 127.0.0.1:8803;
    default 127.0.0.1:8801;
}

server {
    listen 80;
    listen [::]:80;
    server_name lifeyoume.icu www.lifeyoume.icu
        ops.lifeyoume.icu auth.lifeyoume.icu billing.lifeyoume.icu
        audit.lifeyoume.icu easysay.lifeyoume.icu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lifeyoume.icu www.lifeyoume.icu;

    ssl_certificate /etc/nginx/certs/platform.lifeyoume.icu.pem;
    ssl_certificate_key /etc/nginx/certs/platform.lifeyoume.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /_lifeyoume_access_check {
        internal;
        proxy_pass http://127.0.0.1:8802/api/v1/access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-LifeYouMe-Product-ID $lifeyoume_product_id;
    }

    location /api/pay-skills/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 256k;
    }

    location = /api/v1/products {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /vault {
        return 301 /vault/;
    }

    location = /vault/ {
        set $lifeyoume_product_id privacy-vault;
        auth_request /_lifeyoume_access_check;
        error_page 401 =302 https://auth.lifeyoume.icu/login?return_to=https://lifeyoume.icu/vault/;
        root /var/www;
        try_files $uri /vault/index.html;
        add_header Cache-Control "no-store";
    }

    location /vault/ {
        root /var/www;
        try_files $uri $uri/ /vault/index.html;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    location = /video/ {
        set $lifeyoume_product_id frame60;
        auth_request /_lifeyoume_access_check;
        auth_request_set $lifeyoume_user_id $upstream_http_x_lifeyoume_user_id;
        error_page 401 =302 https://auth.lifeyoume.icu/login?return_to=https://lifeyoume.icu/video/;
        proxy_pass http://127.0.0.1:4321/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-LifeYouMe-User-ID $lifeyoume_user_id;
        proxy_read_timeout 120s;
        client_max_body_size 256k;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/video/';
        sub_filter 'src="/' 'src="/video/';
    }

    location = /video/zhizhu/ {
        set $lifeyoume_product_id frame60;
        auth_request /_lifeyoume_access_check;
        auth_request_set $lifeyoume_user_id $upstream_http_x_lifeyoume_user_id;
        error_page 401 =302 https://auth.lifeyoume.icu/login?return_to=https://lifeyoume.icu/video/zhizhu/;
        proxy_pass http://127.0.0.1:4321/zhizhu/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-LifeYouMe-User-ID $lifeyoume_user_id;
    }

    location /video/ {
        proxy_pass http://127.0.0.1:4321/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 256k;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/video/';
        sub_filter 'src="/' 'src="/video/';
    }

    location ~ ^/(r|c|p|history|badge|api|compare|reports|about|feed\.xml|rss\.xsl|updates|sitemap\.xml|robots\.txt|llms\.txt|indexnow-key\.txt)(/|$) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host audit.lifeyoume.icu;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        client_max_body_size 2m;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8801;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        client_max_body_size 16k;
    }

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        client_max_body_size 2m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ops.lifeyoume.icu auth.lifeyoume.icu billing.lifeyoume.icu;

    ssl_certificate /etc/nginx/certs/platform.lifeyoume.icu.pem;
    ssl_certificate_key /etc/nginx/certs/platform.lifeyoume.icu.key;
