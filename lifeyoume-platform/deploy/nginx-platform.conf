map $host $platform_upstream {
    hostnames;
    ops.lifeyoume.icu 127.0.0.1:8801;
    auth.lifeyoume.icu 127.0.0.1:8802;
    billing.lifeyoume.icu 127.0.0.1:8803;
    default 127.0.0.1:8801;
}

server {
    listen 80;
    listen [::]:80;
    server_name lifeyoume.icu www.lifeyoume.icu
        ops.lifeyoume.icu auth.lifeyoume.icu billing.lifeyoume.icu
        audit.lifeyoume.icu easysay.lifeyoume.icu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lifeyoume.icu www.lifeyoume.icu;

    ssl_certificate /etc/nginx/certs/platform.lifeyoume.icu.pem;
    ssl_certificate_key /etc/nginx/certs/platform.lifeyoume.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/v1/products {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(r|c|p|history|badge|api|compare|reports|about|feed\.xml|rss\.xsl|updates|sitemap\.xml|robots\.txt|llms\.txt|indexnow-key\.txt)(/|$) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host audit.lifeyoume.icu;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        client_max_body_size 2m;
    }

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        client_max_body_size 2m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ops.lifeyoume.icu auth.lifeyoume.icu billing.lifeyoume.icu;

    ssl_certificate /etc/nginx/certs/platform.lifeyoume.icu.pem;
    ssl_certificate_key /etc/nginx/certs/platform.lifeyoume.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://$platform_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        client_max_body_size 2m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name audit.lifeyoume.icu;

    ssl_certificate /etc/nginx/certs/platform.lifeyoume.icu.pem;
    ssl_certificate_key /etc/nginx/certs/platform.lifeyoume.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        client_max_body_size 2m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name easysay.lifeyoume.icu;

    ssl_certificate /etc/nginx/certs/platform.lifeyoume.icu.pem;
    ssl_certificate_key /etc/nginx/certs/platform.lifeyoume.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 503;
}
