map $host $platform_upstream {
    hostnames;
    ops.lifeyoume.icu 127.0.0.1:8801;
    auth.lifeyoume.icu 127.0.0.1:8802;
    billing.lifeyoume.icu 127.0.0.1:8803;
    default 127.0.0.1:8801;
}

server {
    listen 80;
    listen [::]:80;
    server_name lifeyoume.icu www.lifeyoume.icu
        ops.lifeyoume.icu auth.lifeyoume.icu billing.lifeyoume.icu
        audit.lifeyoume.icu easysay.lifeyoume.icu meyou.lifeyoume.icu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meyou.lifeyoume.icu;

    ssl_certificate /etc/nginx/certs/meyou.lifeyoume.icu.pem;
    ssl_certificate_key /etc/nginx/certs/meyou.lifeyoume.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /_lifeyoume_access_check {
        internal;
        proxy_pass http://127.0.0.1:8802/api/v1/access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-LifeYouMe-Product-ID $lifeyoume_product_id;
    }

    location = /health {
        proxy_pass http://127.0.0.1:43180;
    }

    location = / {
        proxy_pass http://127.0.0.1:43180;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:43180;
        expires 1h;
    }

    location ~ ^/(favicon\.svg|favicon\.ico|apple-touch-icon\.png|safari-pinned-tab\.svg|site\.webmanifest)$ {
        proxy_pass http://127.0.0.1:43180;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ ^/@[a-zA-Z0-9_-]+/?$ {
        proxy_pass http://127.0.0.1:43180;
    }

    location /api/v1/public/ {
        proxy_pass http://127.0.0.1:43180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 64k;
    }

    location /internal/ {
        return 404;
    }

    location = /product-disabled {
        internal;
        default_type text/html;
        return 403 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeYou 暂不可用</title></head><body><main><h1>遇见 MeYou 暂未开放</h1><p>请返回 LifeYouMe 产品目录查看当前状态。</p><a href="https://lifeyoume.icu/products">返回产品目录</a></main></body></html>';
    }

    location = /api/v1/events {
        set $lifeyoume_product_id meyou-agent-network;
        auth_request /_lifeyoume_access_check;
        auth_request_set $lifeyoume_user_id $upstream_http_x_lifeyoume_user_id;
        error_page 401 =302 https://auth.lifeyoume.icu/login?return_to=https://meyou.lifeyoume.icu/app;
        proxy_pass http://127.0.0.1:43180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-LifeYouMe-User-ID $lifeyoume_user_id;
        proxy_read_timeout 3600s;
    }

    location / {
        set $lifeyoume_product_id meyou-agent-network;
        auth_request /_lifeyoume_access_check;
        auth_request_set $lifeyoume_user_id $upstream_http_x_lifeyoume_user_id;
        error_page 401 =302 https://auth.lifeyoume.icu/login?return_to=https://meyou.lifeyoume.icu/app;
        error_page 403 = /product-disabled;
        proxy_pass http://127.0.0.1:43180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-LifeYouMe-User-ID $lifeyoume_user_id;
        proxy_read_timeout 1900s;
        client_max_body_size 1m;
    }
}

