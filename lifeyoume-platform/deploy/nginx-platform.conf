        client_max_body_size 2m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name audit.lifeyoume.icu;

    ssl_certificate /etc/nginx/certs/platform.lifeyoume.icu.pem;
    ssl_certificate_key /etc/nginx/certs/platform.lifeyoume.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /_lifeyoume_access_check {
        internal;
        proxy_pass http://127.0.0.1:8802/api/v1/access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-LifeYouMe-Product-ID $lifeyoume_product_id;
    }

    location /api/pay-skills/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 256k;
    }

    location = / {
        set $lifeyoume_product_id audit;
        auth_request /_lifeyoume_access_check;
        auth_request_set $lifeyoume_user_id $upstream_http_x_lifeyoume_user_id;
        error_page 401 =302 https://auth.lifeyoume.icu/login?return_to=https://audit.lifeyoume.icu/;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-LifeYouMe-User-ID $lifeyoume_user_id;
        proxy_read_timeout 35s;
        client_max_body_size 2m;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        client_max_body_size 2m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name easysay.lifeyoume.icu;

    ssl_certificate /etc/nginx/certs/platform.lifeyoume.icu.pem;
    ssl_certificate_key /etc/nginx/certs/platform.lifeyoume.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
