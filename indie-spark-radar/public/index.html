<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Indie Spark Radar｜个人小项目灵感雷达</title>
    <meta name="description" content="发现有趣个人小项目，并用 LifeYouMe MaaS 拆解可复刻方向。">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#projects">跳到项目列表</a>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">LIFEYOUME / INDIE LAB</p>
          <h1 id="page-title">把网上好玩的小项目，拆成你能开工的灵感。</h1>
          <p class="hero-lede">
            我会把 Show HN、V2EX 这类地方冒出来的个人项目整理成卡片，再用你的 MaaS 模型生成中文点评、三天薄切片和风险提醒。
          </p>
          <div class="hero-actions">
            <a class="button primary" href="#projects">看看今天有什么</a>
            <button class="button ghost" id="random-button" type="button">随机给我一个</button>
          </div>
        </div>
        <div class="hero-panel" aria-label="今日雷达摘要">
          <div class="orb one"></div>
          <div class="orb two"></div>
          <p class="panel-label">Radar pulse</p>
          <strong id="project-count">10</strong>
          <span>个可复刻小项目</span>
          <div class="mini-grid" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </section>

      <section class="toolbar" aria-label="筛选项目">
        <label class="search-box">
          <span>搜索关键词</span>
          <input id="query" type="search" placeholder="例如 Agent、地图、小游戏、CI">
        </label>
        <label class="select-box">
          <span>方向</span>
          <select id="category">
            <option value="">全部方向</option>
          </select>
        </label>
        <label class="angle-box">
          <span>我的二创方向</span>
          <input id="angle" type="text" maxlength="160" placeholder="例如：做成中文站长工具 / 做成 Mac 菜单栏">
        </label>
      </section>

      <section class="content-shell">
        <section id="projects" class="project-grid" aria-live="polite" aria-label="项目列表"></section>

        <aside class="insight-card" aria-labelledby="insight-title">
          <p class="eyebrow">MAAS NOTE</p>
          <h2 id="insight-title">选一个项目，我来拆。</h2>
          <p id="insight-empty">
            点击卡片里的“拆解灵感”，后端会请求 LifeYouMe MaaS；如果还没填 Key，会用本地规则先给你一个可执行版本。
          </p>
          <div id="insight-result" hidden></div>
        </aside>
      </section>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
