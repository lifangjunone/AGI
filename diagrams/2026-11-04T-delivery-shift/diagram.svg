<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#182230" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#667085"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#23824A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#FCFBF8"/>
  <text x="52" y="54" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#111827">
    应对方案：让业务工作直接生成数字员工
  </text>
  <text x="52" y="88" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#667085">
    从多角色转译、人工搭建，升级为业务人员零额外负担的持续学习与自动构建
  </text>

  <!-- Traditional model -->
  <rect x="52" y="122" width="1096" height="154" rx="24" fill="#F5F6F7" stroke="#D0D5DD" stroke-width="2"/>
  <rect x="76" y="142" width="132" height="32" rx="16" fill="#EAECF0"/>
  <text x="142" y="164" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#475467">
    传统交付方式
  </text>
  <text x="1048" y="164" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#B54708">
    链路长 · 转译多 · 难复制
  </text>

  <g filter="url(#shadow)">
    <rect x="92" y="193" width="210" height="60" rx="16" fill="#FFFFFF" stroke="#D0D5DD"/>
    <text x="197" y="218" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#344054">产品服务商</text>
    <text x="197" y="241" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#667085">指导产品怎么使用</text>

    <rect x="366" y="193" width="210" height="60" rx="16" fill="#FFFFFF" stroke="#D0D5DD"/>
    <text x="471" y="218" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#344054">客户技术人员</text>
    <text x="471" y="241" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#667085">学习并转译产品能力</text>

    <rect x="640" y="193" width="210" height="60" rx="16" fill="#FFFFFF" stroke="#D0D5DD"/>
    <text x="745" y="218" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#344054">客户业务人员</text>
    <text x="745" y="241" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#667085">额外投入时间搭建</text>

    <rect x="914" y="193" width="194" height="60" rx="16" fill="#FFF5EB" stroke="#F79009" stroke-width="2"/>
    <text x="1011" y="218" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#7A2E0E">业务数字员工</text>
    <text x="1011" y="241" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#B54708">一次建设、持续维护</text>
  </g>

  <path d="M302 223 H354" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrowGray)"/>
  <path d="M576 223 H628" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrowGray)"/>
  <path d="M850 223 H902" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrowGray)"/>

  <!-- Transformation -->
  <path d="M600 285 V330" fill="none" stroke="#23824A" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <rect x="427" y="290" width="346" height="32" rx="16" fill="#EAF8EF"/>
  <text x="600" y="312" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#176238">
    去掉中间转译，让真实工作成为学习材料
  </text>

  <!-- Upgraded model -->
  <rect x="52" y="340" width="1096" height="176" rx="28" fill="#FFFFFF" stroke="#23824A" stroke-width="3" filter="url(#shadow)"/>
  <rect x="76" y="360" width="132" height="32" rx="16" fill="#DDF3E5"/>
  <text x="142" y="382" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#176238">
    升级工作方式
  </text>
  <rect x="917" y="360" width="191" height="32" rx="16" fill="#EAF8EF"/>
  <text x="1012" y="382" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#176238">
    业务工作即能力生产
  </text>

  <g>
    <circle cx="184" cy="445" r="48" fill="#FFF1DF" stroke="#E97917" stroke-width="2.5"/>
    <circle cx="184" cy="430" r="13" fill="#E97917"/>
    <path d="M158 470 C160 447 208 447 210 470" fill="#E97917"/>
    <text x="252" y="425" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937">业务人员照常工作</text>
    <text x="252" y="452" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#667085">不写教程、不学搭建、不切换工作方式</text>
    <text x="252" y="478" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#B54708">零额外工作量</text>

    <path d="M450 445 H526" fill="none" stroke="#23824A" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <circle cx="600" cy="445" r="52" fill="#EAF8EF" stroke="#23824A" stroke-width="2.5"/>
    <circle cx="582" cy="434" r="8" fill="#23824A"/>
    <circle cx="600" cy="422" r="8" fill="#23824A"/>
    <circle cx="618" cy="434" r="8" fill="#23824A"/>
    <path d="M582 454 H618" stroke="#23824A" stroke-width="3"/>
    <text x="600" y="514" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#176238">系统持续学习</text>

    <path d="M674 445 H750" fill="none" stroke="#23824A" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <rect x="778" y="398" width="298" height="94" rx="24" fill="#EAF8EF" stroke="#23824A" stroke-width="2.5"/>
    <text x="927" y="430" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#14532D">自动构建业务数字员工</text>
    <text x="927" y="457" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#39714E">学习知识、技能、判断与业务边界</text>
    <text x="927" y="480" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#176238">持续成长，可规模复制</text>
  </g>

  <!-- Value strip -->
  <rect x="172" y="548" width="856" height="48" rx="24" fill="#1F2937"/>
  <circle cx="256" cy="572" r="5" fill="#32F08C"/>
  <text x="276" y="578" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">零额外负担</text>
  <circle cx="524" cy="572" r="5" fill="#32F08C"/>
  <text x="544" y="578" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">持续自动成长</text>
  <circle cx="799" cy="572" r="5" fill="#32F08C"/>
  <text x="819" y="578" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">企业规模复制</text>
</svg>
