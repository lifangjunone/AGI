  </text>

  <!-- Personal digital twin -->
  <path d="M103 522 C103 481 137 448 179 448 H445 C487 448 521 481 521 522 V557 C521 599 487 632 445 632 H179 C137 632 103 599 103 557 Z"
    fill="#FFFFFF" stroke="#23824A" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="174" cy="520" r="34" fill="#DDF3E5" stroke="#23824A" stroke-width="2"/>
  <circle cx="174" cy="511" r="10" fill="#23824A"/>
  <path d="M153 542 C155 524 193 524 195 542" fill="#23824A"/>
  <circle cx="202" cy="492" r="12" fill="#FFFFFF" stroke="#23824A" stroke-width="2"/>
  <text x="234" y="503" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#176238">
