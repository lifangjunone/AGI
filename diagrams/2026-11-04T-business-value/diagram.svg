<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="companionFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4E8"/>
      <stop offset="100%" stop-color="#FFE2BE"/>
    </linearGradient>
    <linearGradient id="assetFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF8EF"/>
      <stop offset="100%" stop-color="#CDEED8"/>
    </linearGradient>
    <linearGradient id="cloudFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF4FF"/>
      <stop offset="100%" stop-color="#DCE8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#182230" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E97917"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3972D5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#FCFBF8"/>

  <text x="64" y="58" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#111827">
    “另一个我”的双出口业务架构
  </text>
  <text x="64" y="92" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#667085">
    桌面端持续学习真人；个人侧形成数字分身，企业侧形成可治理、可投产的数字专家
  </text>

  <!-- Layer labels -->
  <rect x="64" y="122" width="138" height="34" rx="17" fill="#F6E5D1"/>
  <text x="133" y="145" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#8A4610">
    用户端 / 员工端
  </text>
  <line x1="218" y1="139" x2="1336" y2="139" stroke="#E7D7C4" stroke-width="2"/>

  <!-- Human -->
  <circle cx="150" cy="244" r="58" fill="#FFFFFF" stroke="#D6D9DF" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="150" cy="225" r="18" fill="#FFD7AD"/>
  <path d="M116 276 C119 248 181 248 184 276" fill="#F0A35A"/>
  <text x="150" y="326" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#1F2937">
    真人员工 / 专家
  </text>
  <text x="150" y="351" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#667085">
