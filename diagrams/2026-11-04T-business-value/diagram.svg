  </text>

  <g>
    <circle cx="558" cy="773" r="35" fill="#FFF1DF" stroke="#E97917" stroke-width="2"/>
    <text x="558" y="769" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#8A4610">发布</text>
    <text x="558" y="789" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#8A4610">任务</text>

    <path d="M597 773 H661" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrowDark)"/>
    <circle cx="704" cy="773" r="35" fill="#EEF4FF" stroke="#3972D5" stroke-width="2"/>
    <text x="704" y="769" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#2858A5">按才能</text>
    <text x="704" y="789" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#2858A5">匹配</text>

    <path d="M743 773 H807" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrowDark)"/>
    <circle cx="850" cy="773" r="35" fill="#EAF8EF" stroke="#23824A" stroke-width="2"/>
    <circle cx="838" cy="765" r="7" fill="#23824A"/>
    <circle cx="850" cy="755" r="7" fill="#23824A"/>
    <circle cx="862" cy="765" r="7" fill="#23824A"/>
    <text x="850" y="796" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#176238">自由组队</text>

    <path d="M889 773 H953" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrowDark)"/>
    <circle cx="996" cy="773" r="35" fill="#F3F0FF" stroke="#7955C8" stroke-width="2"/>
    <text x="996" y="769" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#5A3B9E">协同</text>
    <text x="996" y="789" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#5A3B9E">交付</text>

    <path d="M1035 773 H1099" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrowDark)"/>
    <circle cx="1142" cy="773" r="35" fill="#F5F6F7" stroke="#667085" stroke-width="2"/>
    <text x="1142" y="769" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#344054">结果</text>
    <text x="1142" y="789" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#344054">验收</text>
  </g>

  <!-- Feedback loops -->
  <path d="M1142 738 V690 H1268 V632" fill="none" stroke="#3972D5" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/>
  <text x="1246" y="708" text-anchor="end" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#3972D5">
    绩效与任务证据回流
  </text>
  <path d="M312 632 V650 H150 V365" fill="none" stroke="#23824A" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowDark)"/>
  <text x="222" y="650" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#23824A">
    工作结果反馈
  </text>

  <rect x="340" y="853" width="720" height="34" rx="17" fill="#1F2937"/>
  <text x="700" y="876" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">
    数字员工负责可验证的执行工作，真人负责目标、判断、例外与领导
  </text>
</svg>
