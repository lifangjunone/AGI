  </text>
  <line x1="218" y1="683" x2="1336" y2="683" stroke="#D5DCE8" stroke-width="2"/>

  <path d="M1118 632 V710 H1074" fill="none" stroke="#3972D5" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <rect x="188" y="714" width="1120" height="120" rx="36" fill="#FFFFFF" stroke="#98A2B3" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="238" y="747" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937">
