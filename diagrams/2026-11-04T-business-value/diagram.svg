  </text>

  <!-- Real work signals -->
  <g>
    <rect x="258" y="181" width="112" height="38" rx="19" fill="#FFFFFF" stroke="#D6D9DF"/>
    <text x="314" y="206" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#344054">消息沟通</text>
    <rect x="258" y="229" width="112" height="38" rx="19" fill="#FFFFFF" stroke="#D6D9DF"/>
    <text x="314" y="254" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#344054">任务执行</text>
    <rect x="258" y="277" width="112" height="38" rx="19" fill="#FFFFFF" stroke="#D6D9DF"/>
    <text x="314" y="302" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#344054">判断反馈</text>
  </g>
  <path d="M208 244 H240" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrowDark)"/>
  <path d="M382 248 H454" fill="none" stroke="#E97917" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="418" y="231" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="600" fill="#A84F0A">
    持续学习
  </text>

  <!-- Another Me companion -->
  <rect x="468" y="166" width="390" height="176" rx="38" fill="url(#companionFill)" stroke="#E97917" stroke-width="3" filter="url(#shadow)"/>
  <rect x="502" y="199" width="94" height="72" rx="10" fill="#FFFFFF" stroke="#E9A463" stroke-width="2"/>
  <rect x="513" y="210" width="72" height="46" rx="5" fill="#FFF1DF"/>
  <line x1="530" y1="283" x2="568" y2="283" stroke="#E97917" stroke-width="4"/>
  <text x="625" y="208" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#A84F0A">
    桌面端工作伴侣
  </text>
  <text x="625" y="244" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#1F2937">
