  </text>
  <rect x="151" y="589" width="321" height="27" rx="13.5" fill="#F0F8F3"/>
  <text x="312" y="608" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#39714E">
    执行结果持续反馈，个人数字分身越用越懂你
  </text>

  <!-- AgentSphere governance -->
  <path d="M879 522 C879 481 913 448 955 448 H1282 C1324 448 1358 481 1358 522 V557 C1358 599 1324 632 1282 632 H955 C913 632 879 599 879 557 Z"
