  <text x="1142" y="494" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#2858A5">
    数字员工管控端
  </text>
  <text x="1142" y="528" font-family="Noto Sans SC, sans-serif" font-size="25" font-weight="700" fill="#1F2937">
