  </text>
  <g>
    <rect x="934" y="581" width="82" height="28" rx="14" fill="#FFFFFF"/>
    <text x="975" y="600" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#2858A5">身份权限</text>
    <rect x="1026" y="581" width="82" height="28" rx="14" fill="#FFFFFF"/>
    <text x="1067" y="600" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#2858A5">技能认证</text>
    <rect x="1118" y="581" width="82" height="28" rx="14" fill="#FFFFFF"/>
    <text x="1159" y="600" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#2858A5">绩效评估</text>
    <rect x="1210" y="581" width="96" height="28" rx="14" fill="#FFFFFF"/>
    <text x="1258" y="600" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#2858A5">调度与审计</text>
  </g>

  <!-- Production layer -->
  <rect x="64" y="666" width="138" height="34" rx="17" fill="#EAEFF8"/>
  <text x="133" y="689" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#344B73">
