  </text>
  <text x="625" y="275" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#5F4630">
    在真实工作中学习，不打断真人
  </text>
  <g>
    <rect x="507" y="299" width="72" height="28" rx="14" fill="#FFFFFF"/>
    <text x="543" y="319" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#7C3F0D">知识</text>
    <rect x="587" y="299" width="72" height="28" rx="14" fill="#FFFFFF"/>
    <text x="623" y="319" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#7C3F0D">技能</text>
    <rect x="667" y="299" width="72" height="28" rx="14" fill="#FFFFFF"/>
    <text x="703" y="319" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#7C3F0D">判断</text>
    <rect x="747" y="299" width="78" height="28" rx="14" fill="#FFFFFF"/>
    <text x="786" y="319" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" fill="#7C3F0D">边界</text>
  </g>

  <!-- Capability asset hub -->
  <path d="M663 342 V382" fill="none" stroke="#E97917" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <polygon points="536,402 570,372 756,372 790,402 756,432 570,432"
    fill="url(#assetFill)" stroke="#23824A" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="663" y="398" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#14532D">
    已验证能力资产
  </text>
  <text x="663" y="421" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#39714E">
    能力快照 · 证据 · 适用条件 · 任务结果
  </text>

  <!-- Split paths -->
  <path d="M536 402 H402 V478" fill="none" stroke="#23824A" stroke-width="4" marker-end="url(#arrowDark)"/>
  <path d="M790 402 H998 V478" fill="none" stroke="#3972D5" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <rect x="250" y="382" width="150" height="32" rx="16" fill="#EAF8EF"/>
  <text x="325" y="404" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#176238">
