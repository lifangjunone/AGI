  </text>
  <rect x="1000" y="382" width="150" height="32" rx="16" fill="#EEF4FF"/>
  <text x="1075" y="404" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#2858A5">
