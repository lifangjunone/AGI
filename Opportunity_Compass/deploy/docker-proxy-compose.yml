services:
  proxy:
    image: english-learning-frontend:latest
    container_name: opportunity_factory_proxy
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate --header='Host: lifeyoume.icu' https://127.0.0.1/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./empty.conf:/etc/nginx/conf.d/app.conf:ro
      - /data/app/english-learning/certs:/etc/nginx/certs:ro
      - ../certbot/www:/var/www/certbot:ro

networks: {}
