<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
    <title>今日小记</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header id="topbar" class="topbar drag-region" title="双击折叠或展开">
        <div id="titleToggle" class="date-block no-drag">
          <p id="weekday" class="eyebrow"></p>
          <h1 id="dateTitle"></h1>
          <span id="collapsedSummary" class="collapsed-summary"></span>
        </div>
        <div class="window-actions no-drag">
          <button id="collapseButton" class="icon-button" type="button" aria-label="折叠便笺" title="折叠便笺">
            <i data-lucide="chevrons-down-up"></i>
          </button>
          <button id="settingsButton" class="icon-button" type="button" aria-label="设置" title="设置">
            <i data-lucide="settings-2"></i>
          </button>
          <button id="hideButton" class="icon-button" type="button" aria-label="隐藏" title="隐藏 (Esc)">
            <i data-lucide="minus"></i>
          </button>
        </div>
      </header>

      <section class="progress-section" aria-label="今日进度">
        <div class="progress-copy">
          <span id="progressText">今天还没有待办</span>
          <strong id="progressPercent">0%</strong>
        </div>
        <progress id="progressBar" class="progress-track" max="100" value="0"></progress>
      </section>

      <form id="quickAddForm" class="quick-add no-drag">
        <i data-lucide="plus"></i>
        <input id="quickAddInput" maxlength="120" autocomplete="off" placeholder="添加一件今天要做的事" aria-label="添加今日待办">
        <button type="submit">添加</button>
      </form>

      <nav class="filter-bar no-drag" aria-label="待办筛选">
        <div class="segmented-control">
          <button type="button" class="filter active" data-filter="active">待完成 <span id="activeCount">0</span></button>
          <button type="button" class="filter" data-filter="completed">已完成 <span id="completedCount">0</span></button>
        </div>
        <button id="clearCompleted" class="text-button hidden" type="button">清空</button>
      </nav>

      <section id="taskList" class="task-list no-drag" aria-live="polite"></section>

      <footer class="footer no-drag">
        <button id="reminderSummary" class="reminder-summary" type="button">
          <i data-lucide="bell-ring"></i>
          <span>智能提醒已开启</span>
        </button>
        <span class="shortcut">⌘⇧Space</span>
      </footer>
    </main>

    <dialog id="taskDialog">
      <form id="taskForm" method="dialog">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">安排一下</p>
            <h2>待办详情</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="关闭" title="关闭" type="submit">
            <i data-lucide="x"></i>
          </button>
        </div>
        <label>
          待办内容
          <input id="taskTitleInput" maxlength="120" required>
        </label>
        <div class="form-row">
          <label>
            提醒时间
            <input id="taskTimeInput" type="time">
          </label>
          <label class="toggle-label">
            置顶
            <input id="taskPriorityInput" type="checkbox">
            <span class="toggle"></span>
          </label>
        </div>
        <button id="saveTaskButton" class="primary-button" value="default" type="submit">保存</button>
      </form>
    </dialog>

    <dialog id="settingsDialog">
      <form method="dialog">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">偏好设置</p>
            <h2>保持专注</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="关闭" title="关闭" type="submit">
            <i data-lucide="x"></i>
          </button>
        </div>
        <fieldset class="paper-picker">
          <legend>纸张颜色</legend>
          <div class="paper-swatches" role="radiogroup" aria-label="纸张颜色">
            <button class="paper-swatch sage" data-paper="sage" type="button" role="radio" aria-label="青绿纸张" title="青绿"></button>
            <button class="paper-swatch sun" data-paper="sun" type="button" role="radio" aria-label="暖黄纸张" title="暖黄"></button>
            <button class="paper-swatch rose" data-paper="rose" type="button" role="radio" aria-label="雾粉纸张" title="雾粉"></button>
            <button class="paper-swatch sky" data-paper="sky" type="button" role="radio" aria-label="浅蓝纸张" title="浅蓝"></button>
            <button class="paper-swatch snow" data-paper="snow" type="button" role="radio" aria-label="白色纸张" title="白色"></button>
          </div>
        </fieldset>
        <fieldset class="corner-picker">
          <legend>收起后固定位置</legend>
          <div class="corner-options" role="radiogroup" aria-label="便签固定位置">
            <button class="corner-option" data-dock="left" type="button" role="radio" aria-label="固定到左上角">
              <i data-lucide="panel-left"></i><span>左上角</span>
            </button>
            <button class="corner-option" data-dock="right" type="button" role="radio" aria-label="固定到右上角">
              <i data-lucide="panel-right"></i><span>右上角</span>
            </button>
          </div>
        </fieldset>
        <label class="setting-row">
          <span><strong>智能提醒</strong><small>在合适的时间提醒未完成事项</small></span>
          <input id="remindersToggle" type="checkbox">
          <span class="toggle"></span>
        </label>
        <label class="setting-row">
          <span><strong>窗口置顶</strong><small>让今日待办保持触手可及</small></span>
          <input id="alwaysOnTopToggle" type="checkbox">
          <span class="toggle"></span>
        </label>
        <label class="setting-row">
          <span><strong>开机启动</strong><small>登录 Mac 后自动在菜单栏运行</small></span>
          <input id="launchAtLoginToggle" type="checkbox">
          <span class="toggle"></span>
        </label>
        <button id="quitButton" class="danger-button" type="button">退出今日小记</button>
      </form>
    </dialog>

    <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
